<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#178a49">
<title>英语不规则动词练习</title>
<style>
:root{--s:1;--bg:#eef8f1;--card:#fff;--ink:#12281b;--mut:#5d7a69;--g1:#e3f5ea;--g2:#bfe8cd;--g5:#22a55b;--g6:#178a49;--g7:#0f6e3a;--bad:#d9534f;--badbg:#fdecea;--ok:#e2f7e9;--ln:#cfe6d8;--sh:0 6px 24px rgba(18,110,60,.12)}
@media(prefers-color-scheme:dark){:root{--bg:#0b1810;--card:#13271b;--ink:#e6f4ea;--mut:#8fb09d;--g1:#183a28;--g2:#245339;--ln:#245339;--ok:#1b4a2e;--badbg:#3b1e1e;--sh:none}}
*{box-sizing:border-box}[hidden]{display:none!important}
html{font-size:calc(16px*var(--s));-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.5 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,Arial,sans-serif}
.wrap{max-width:52rem;margin:0 auto;padding:max(.75rem,env(safe-area-inset-top)) .75rem 6rem;display:grid;gap:.75rem}
.hero{position:relative;background:linear-gradient(135deg,var(--g7),var(--g5));color:#fff;border-radius:1.25rem;padding:1.1rem 1.2rem;box-shadow:var(--sh)}
.avatar{position:absolute;top:.8rem;right:.8rem;width:clamp(3rem,12vw,4.5rem);aspect-ratio:1;border-radius:50%;border:3px solid #fff;background:rgba(255,255,255,.25);display:grid;place-items:center;font-size:1.6rem;overflow:hidden;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero h1{margin:0 0 .7rem;padding-right:clamp(3.6rem,14vw,5.2rem);font-size:clamp(1.2rem,5vw,1.9rem);line-height:1.25}
.bar{height:.5rem;border-radius:9px;background:rgba(255,255,255,.28);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#fff;border-radius:9px;transition:width .3s}
.hero small{display:block;margin-top:.4rem;opacity:.92}
.card{background:var(--card);border:2px solid var(--ln);border-radius:1.1rem;padding:.9rem;box-shadow:var(--sh);display:grid;gap:.7rem;transition:background .2s,border-color .2s}
.card.ok{border-color:var(--g5);background:var(--ok)}
.card.bad{border-color:var(--bad);background:var(--badbg);animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;justify-content:center}
.mut{color:var(--mut)}
.btn{font:inherit;font-weight:600;min-height:2.75rem;padding:.4rem 1rem;border-radius:.8rem;border:1px solid var(--ln);background:var(--g1);color:var(--g7);cursor:pointer;transition:filter .15s,transform .1s}
@media(prefers-color-scheme:dark){.btn{color:var(--ink)}}
.btn:hover{filter:brightness(.96)}.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.on,.btn.pri{background:var(--g6);border-color:var(--g7);color:#fff}
.seg{display:inline-flex;border:1px solid var(--ln);border-radius:.9rem;overflow:hidden}
.seg .btn{border:0;border-radius:0;background:transparent}
.seg .btn.on{background:var(--g6);color:#fff}
#sentenceNumber{width:4.2rem;min-height:2.75rem;text-align:center;font:inherit;font-weight:700;border:2px solid var(--g5);border-radius:.8rem;background:var(--card);color:var(--ink)}
#sentenceNumber:disabled{opacity:.5}
#indicator{display:grid;gap:.25rem;text-align:center;padding:.5rem}
.t1{font-size:clamp(1.15rem,4.5vw,1.6rem);font-weight:700;color:var(--g6)}
.t2{font-size:clamp(1rem,3.8vw,1.35rem)}
.t3{font-size:clamp(1rem,3.8vw,1.3rem);font-weight:700;color:var(--mut)}
.inp{display:flex;gap:.5rem;flex-wrap:wrap}
#answerInput{flex:1 1 14rem;min-width:0;font:inherit;font-size:max(16px,1.2rem);padding:.8rem 1rem;border-radius:.9rem;border:2px solid var(--g2);background:var(--g1);color:var(--ink);outline:none}
#answerInput:focus{border-color:var(--g5);box-shadow:0 0 0 3px rgba(34,165,91,.25)}
.zone,.bank{display:flex;flex-wrap:wrap;gap:.5rem;padding:.7rem;border-radius:1rem;min-height:4rem;align-content:flex-start}
.zone{border:2px dashed var(--g2);background:var(--g1)}
.zone:empty::before{content:"点击下方词语，拼成句子";color:var(--mut);align-self:center;margin:auto}
.chip{font:inherit;font-size:clamp(1rem,3.8vw,1.3rem);font-weight:600;padding:.45rem .85rem;border-radius:.75rem;border:1px solid var(--g2);background:var(--card);color:var(--ink);box-shadow:0 2px 0 var(--g2);cursor:pointer;touch-action:manipulation}
.chip:active{transform:translateY(1px);box-shadow:none}
.zone .chip{background:var(--g6);color:#fff;border-color:var(--g7);box-shadow:0 2px 0 var(--g7)}
.chip:disabled{cursor:default}
.bank .chip.used{background:var(--g2);color:var(--mut);border-color:var(--g2);box-shadow:none;opacity:.55}
#wrongSentences{padding:.6rem .8rem;border-radius:.8rem;background:var(--badbg);color:var(--bad);font-weight:600;word-break:break-word}
footer{text-align:center;color:var(--mut);font-size:.85rem;display:grid;gap:.2rem}
.kbd{display:none}
@media(hover:hover) and (pointer:fine){.kbd{display:block}}
.fab{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));z-index:9;display:flex;flex-direction:column;align-items:flex-end;gap:8px;font-size:16px}
.fab>button.main{width:54px;height:54px;border-radius:50%;border:0;background:var(--g6);color:#fff;font:700 20px system-ui;box-shadow:0 6px 18px rgba(0,0,0,.3);cursor:pointer}
.panel{display:flex;align-items:center;gap:6px;padding:8px;border-radius:16px;background:var(--card);border:2px solid var(--ln);box-shadow:0 6px 18px rgba(0,0,0,.25)}
.panel button{width:42px;height:42px;border-radius:12px;border:1px solid var(--ln);background:var(--g1);color:var(--g7);font:700 17px system-ui;cursor:pointer}
@media(prefers-color-scheme:dark){.panel button{color:var(--ink)}}
.panel output{min-width:48px;text-align:center;font-weight:700;color:var(--ink)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="avatar" title="头像">👤<img src="avatar.jpg" alt="头像" onerror="this.remove()"></div>
    <h1>英语不规则动词练习</h1>
    <div class="bar"><i id="barFill"></i></div>
    <small id="barTxt"></small>
  </header>

  <section class="card">
    <div class="row">
      <button id="prevBtn" class="btn" aria-label="上一题">◀</button>
      <input type="text" id="sentenceNumber" inputmode="numeric" pattern="[0-9]*" aria-label="题号">
      <span class="mut">/ <span id="total"></span></span>
      <button id="nextBtn" class="btn" aria-label="下一题">▶</button>
      <button id="replayBtn" class="btn pri">🔊 再听一遍</button>
    </div>
    <div class="row">
      <div class="seg"><button id="freeModeBtn" class="btn">自由模式</button><button id="testModeBtn" class="btn">作业模式</button></div>
      <div class="seg"><button id="typeModeBtn" class="btn">⌨ 打字</button><button id="tapModeBtn" class="btn">👆 点选</button></div>
    </div>
    <div class="row" id="freeOnly">
      <button id="autoContinueBtn" class="btn">自动继续</button>
      <button id="showHideBtn" class="btn">显示-隐藏</button>
    </div>
    <div class="row" id="testOnly">
      <b id="score"></b>
      <button id="restartBtn" class="btn">重新开始</button>
    </div>
  </section>

  <section class="card" id="answerCard">
    <div id="indicator" aria-live="polite"></div>
    <div class="inp" id="typeBox">
      <input type="text" id="answerInput" placeholder="输入所听到的内容" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <button id="checkBtn" class="btn pri">检查</button>
    </div>
    <div id="tapBox" hidden>
      <div id="zone" class="zone"></div>
      <div id="bank" class="bank"></div>
      <div class="row">
        <button id="shuffleBtn" class="btn">🔀 重排</button>
        <button id="clearBtn" class="btn">清空</button>
        <button id="checkTapBtn" class="btn pri">检查</button>
      </div>
    </div>
    <div id="wrongSentences" hidden></div>
  </section>

  <footer>
    <div>关注我们 - 天天练习: YouTube: · TikTok: · Facebook:</div>
    <div>阮玉煌 | Weixin：XiDeYueNanYu</div>
    <div class="kbd">快键: Ctrl+F (再听一遍) | Ctrl+8 (上一题) | Ctrl+9 (下一题)</div>
  </footer>
</div>

<div class="fab" id="fab">
  <div class="panel" id="panel" hidden>
    <button id="smaller" aria-label="缩小">A−</button>
    <output id="pct">100%</output>
    <button id="bigger" aria-label="放大">A+</button>
    <button id="resetSize" aria-label="还原">↺</button>
  </div>
  <button class="main" id="fabBtn" aria-label="调整大小" aria-expanded="false">Aa</button>
</div>

<audio id="mainAudio" preload="none"></audio>
<audio id="correctAudio" src="Dung.mp3"></audio>
<audio id="wrongAudio" src="Sai.mp3"></audio>

        {"audioFile":"1-21.mp3","start":0,"end":1.760889,"text":"I abide by the rules.","text2":"Tôi tuân thủ các quy tắc.","text3":"/aɪ əˈbaɪd baɪ ðə ruːlz/","text4":"1. Abide (lưu trú, lưu lại)","text5":"V1"},

        {"audioFile":"1-21.mp3","start":4.63678,"end":6.635626,"text":"He has abided by his promise.","text2":"Anh ấy đã giữ lời hứa của mình.","text3":"/hi həz əˈbaɪdɪd baɪ hɪz ˈprɑːmɪs/","text4":"1. Abide (lưu trú, lưu lại)","text5":"V3"},

        {"audioFile":"1-21.mp3","start":8.906425,"end":10.810088,"text":"A conflict arose yesterday.","text2":"Một cuộc xung đột đã phát sinh hôm qua.","text3":"/ə kənˈflɪkt əˈroʊz ˈjɛstərdeɪ/","text4":"2. Arise (phát sinh)","text5":"V2"},

const COUNT_URL = 'https://script.google.com/macros/s/AKfycbyN73yXupfJf7kFNJS4ToB2LdbA3CdXy318EpEQik3EMP_uPypRRZgY9jH1wgT-lHjO/exec';
async function incrementCompletedCount() {
  try { const r = await fetch(COUNT_URL, { method: 'POST' }); return (await r.json()).completedCount; }
  catch (e) { console.error('Lỗi khi tăng số đếm:', e); return 0; }
}

const $ = id => document.getElementById(id);
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const N = sentences.length;
const audio = $('mainAudio'), correctAudio = $('correctAudio'), wrongAudio = $('wrongAudio');
const input = $('answerInput'), num = $('sentenceNumber'), card = $('answerCard'), ind = $('indicator');
const navEls = [$('prevBtn'), $('nextBtn'), $('replayBtn'), num];

// ===== Lưu tiến trình (localStorage) =====
const KEY = 'vnListen.v1';
let st = { i: 0, free: true, tap: false, auto: false, show: false, scale: 1, correct: [], wrong: [], done: false };
try { Object.assign(st, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
if (!(st.i >= 0 && st.i < N)) st.i = 0;
const correct = new Set(st.correct), wrong = new Set(st.wrong);
function save() {
  st.correct = [...correct]; st.wrong = [...wrong];
  try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {}
}

// ===== Âm thanh =====
let playing = false;
function lock(v) { playing = v; navEls.forEach(b => b.disabled = v); }
function play() {
  const s = sentences[st.i];
  lock(true);
  const go = () => { audio.currentTime = s.start; audio.play().catch(() => lock(false)); };
  if (audio.dataset.f !== s.audioFile) {
    audio.dataset.f = s.audioFile; audio.src = s.audioFile;
    audio.addEventListener('loadedmetadata', go, { once: true });
    audio.load();
  } else go();
  audio.ontimeupdate = () => { if (audio.currentTime >= s.end) { audio.pause(); lock(false); } };
}
audio.onended = audio.onerror = () => lock(false);
function sfx(a, adv) {
  a.onended = adv ? () => setTimeout(() => move(1), 200) : null;
  a.currentTime = 0;
  a.play().catch(() => adv && move(1));
}

// ===== Chế độ bấm nút: tách câu thành từ, xáo ngẫu nhiên =====
const norm = t => t.normalize('NFC').toLowerCase().replace(/[,.!?;:"“”‘’()…]/g, ' ').replace(/\s+/g, ' ').trim();
let bank = [], placed = [], solved = false;
function shuffle(a) {
  const o = a.map(x => x.id).join(); let n = 0;
  do { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } }
  while (a.length > 1 && a.map(x => x.id).join() === o && ++n < 10);
}
function buildTap() {
  bank = norm(sentences[st.i].text).split(' ').map((w, id) => ({ id, w }));
  shuffle(bank); placed = []; solved = false; drawTap();
}
function chip(c, fn) {
  const b = el('button', 'chip', c.w); b.type = 'button'; b.disabled = solved; b.onclick = fn; return b;
}
function unplace(c) { placed = placed.filter(x => x !== c); }
function drawTap() {
  $('zone').replaceChildren(...placed.map(c => chip(c, () => { if (solved) return; unplace(c); card.className = 'card'; drawTap(); })));
  $('bank').replaceChildren(...bank.map(c => {
    const used = placed.includes(c);
    const b = chip(c, () => {
      if (solved) return;
      if (placed.includes(c)) unplace(c); else placed.push(c);
      card.className = 'card'; drawTap();
      if (placed.length === bank.length) checkAnswer();
    });
    if (used) { b.classList.add('used'); b.setAttribute('aria-pressed', 'true'); }
    return b;
  }));
}

// ===== Hiển thị =====
function head() {
  const v = st.free ? st.i + 1 : correct.size;
  $('barFill').style.width = (v / N * 100) + '%';
  $('barTxt').textContent = st.free ? `第 ${st.i + 1} / ${N} 题` : `作业进度 ${correct.size} / ${N}`;
  $('score').textContent = `✔ ${correct.size}/${N}`;
}
function renderWrong() {
  const w = $('wrongSentences');
  if (st.free || !wrong.size) { w.hidden = true; return; }
  w.textContent = '解决问题：' + [...wrong].sort((a, b) => a - b).map(i => i + 1).join('/ ');
  w.hidden = false;
}
function renderMode() {
  $('freeModeBtn').classList.toggle('on', st.free); $('testModeBtn').classList.toggle('on', !st.free);
  $('typeModeBtn').classList.toggle('on', !st.tap); $('tapModeBtn').classList.toggle('on', st.tap);
  $('autoContinueBtn').classList.toggle('on', st.auto); $('showHideBtn').classList.toggle('on', st.show);
  $('freeOnly').hidden = !st.free; $('testOnly').hidden = st.free;
  $('typeBox').hidden = st.tap; $('tapBox').hidden = !st.tap;
}
function render() {
  const s = sentences[st.i];
  num.value = st.i + 1; input.value = ''; card.className = 'card';
  if (st.free && st.show) {
    ind.replaceChildren(el('div', 't1', s.text), el('div', 't2', s.text2), el('div', 't3', s.text3)); ind.hidden = false;
  } else { ind.replaceChildren(); ind.hidden = true; }
  buildTap(); renderMode(); renderWrong(); head(); save();
}
function move(d) { st.i = (st.i + d + N) % N; render(); play(); }

// ===== Kiểm tra đáp án =====
function checkAnswer() {
  if (st.tap && (placed.length < bank.length || solved)) return;
  const right = norm(sentences[st.i].text);
  const ans = st.tap ? placed.map(c => c.w).join(' ') : norm(input.value);
  const ok = ans === right;
  card.className = 'card ' + (ok ? 'ok' : 'bad');
  if (ok) {
    let adv = false;
    if (!st.free && !correct.has(st.i)) { correct.add(st.i); wrong.delete(st.i); adv = true; }
    else if (st.free && st.auto) adv = true;
    solved = true; if (st.tap) drawTap();
    sfx(correctAudio, adv);
  } else {
    sfx(wrongAudio, false);
    if (!st.free && !correct.has(st.i)) wrong.add(st.i);
  }
  save(); renderWrong(); head();
  if (!st.free && correct.size === N && !st.done) finish();
}
async function finish() {
  st.done = true; save();
  const c = await incrementCompletedCount();
  if (c) setTimeout(() => alert(`你是第 ${c} 个完成作业的人！`), 100);
}

// ===== Sự kiện =====
$('prevBtn').onclick = () => move(-1);
$('nextBtn').onclick = () => move(1);
$('replayBtn').onclick = play;
$('checkBtn').onclick = checkAnswer;
$('checkTapBtn').onclick = () => { if (placed.length < bank.length) card.className = 'card bad'; else checkAnswer(); };
$('shuffleBtn').onclick = () => { if (solved) return; placed = []; shuffle(bank); card.className = 'card'; drawTap(); };
$('clearBtn').onclick = () => { if (solved) return; placed = []; card.className = 'card'; drawTap(); };
$('freeModeBtn').onclick = () => { st.free = true; render(); };
$('testModeBtn').onclick = () => { st.free = false; render(); };
$('typeModeBtn').onclick = () => { st.tap = false; render(); input.focus(); };
$('tapModeBtn').onclick = () => { st.tap = true; render(); };
$('autoContinueBtn').onclick = () => { st.auto = !st.auto; if (!st.auto) correctAudio.onended = null; renderMode(); save(); };
$('showHideBtn').onclick = () => { st.show = !st.show; render(); };
$('restartBtn').onclick = () => {
  if (!confirm('重新开始作业？当前进度将被清除。')) return;
  correct.clear(); wrong.clear(); st.done = false; st.i = 0; render(); play();
};
input.addEventListener('keydown', e => { if (e.key === 'Enter') checkAnswer(); });
input.addEventListener('input', () => { card.className = 'card'; });
num.onchange = () => {
  if (playing) return;
  const n = parseInt(num.value, 10) - 1;
  if (n >= 0 && n < N) { st.i = n; render(); play(); }
  else { alert(`输入范围： 1 到 ${N}`); num.value = st.i + 1; }
};
num.onkeydown = e => { if (!playing) { if (e.key === 'ArrowLeft') move(-1); if (e.key === 'ArrowRight') move(1); } };
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && !playing) {
    if (e.key === 'f') { e.preventDefault(); play(); }
    else if (e.key === '8') { e.preventDefault(); move(-1); }
    else if (e.key === '9') { e.preventDefault(); move(1); }
  }
  if (e.key === 'Escape') $('panel').hidden = true;
});

// ===== Nút nổi chỉnh cỡ chữ/giao diện =====
function setScale(v) {
  st.scale = Math.min(1.6, Math.max(0.8, Math.round(v * 10) / 10));
  document.documentElement.style.setProperty('--s', st.scale);
  $('pct').textContent = Math.round(st.scale * 100) + '%'; save();
}
$('fabBtn').onclick = () => { const p = $('panel'); p.hidden = !p.hidden; $('fabBtn').setAttribute('aria-expanded', !p.hidden); };
$('smaller').onclick = () => setScale(st.scale - 0.1);
$('bigger').onclick = () => setScale(st.scale + 0.1);
$('resetSize').onclick = () => setScale(1);
document.addEventListener('click', e => { if (!$('fab').contains(e.target)) $('panel').hidden = true; });

$('total').textContent = N;
setScale(Number(st.scale) || 1);
render();
</script>
</body>
</html>
